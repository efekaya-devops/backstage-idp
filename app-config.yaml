app:
  title: IDP — Internal Developer Platform
  baseUrl: http://localhost:3000
  # using our own /create page instead of the default one, see
  # packages/app/src/modules/scaffolderPage.tsx
  extensions:
    - page:scaffolder: false

organization:
  name: Platform Team

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # sqlite so the demo doesn't need a real db, but on disk rather than
  # :memory: - otherwise every service you registered disappears the moment
  # you restart the portal, which is a horrible surprise mid-demo.
  # postgres if you ever want more than one backend replica.
  database:
    client: better-sqlite3
    connection:
      directory: .data

integrations:
  github:
    - host: github.com
      # needs repo + workflow scopes
      token: ${GITHUB_TOKEN}

auth:
  environment: development
  providers:
    guest: {}

scaffolder: {}

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group]
  locations:
    # the golden path template
    - type: file
      target: ../../templates/create-service/template.yaml
      rules:
        - allow: [Template]
    # infra self-service - both end up as a PR on the gitops repo
    - type: file
      target: ../../templates/request-resource-group/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/request-bucket/template.yaml
      rules:
        - allow: [Template]
    # fake users/groups so ownership shows up somewhere instead of blank
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: kind-idp
          url: ${KUBERNETES_CLUSTER_URL}
          authProvider: serviceAccount
          serviceAccountToken: ${KUBERNETES_SA_TOKEN}
          skipTLSVerify: true
