app:
  title: IDP — Internal Developer Platform
  baseUrl: http://localhost:3000
  extensions:
    - page:scaffolder: false
    # The kubernetes plugin ships a standalone page alongside its entity tab,
    # and the sidebar picks it up automatically. That page renders the entity
    # view with no entity around it, so visiting it only ever produces
    # "entity context is not available". The tab on service pages is a separate
    # extension and stays.
    - page:kubernetes: false

organization:
  name: Platform Team

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection:
      directory: .data

integrations:
  github:
    - host: github.com
      # needs repo + workflow scopes
      token: ${GITHUB_TOKEN}

auth:
  environment: development
  providers:
    guest: {}

scaffolder: {}

# without this the permission policy is never consulted
permission:
  enabled: true

techdocs:
  builder: local
  generator:
    runIn: docker
  publisher:
    type: local
    local:
      # Without this the built docs land in
      # node_modules/@backstage/plugin-techdocs-backend/static/docs, so every
      # yarn install throws them away. That matters more than it sounds: the
      # search indexer runs on startup, finds zero techdocs documents, and Lunr
      # then never creates the techdocs index at all - after which every query
      # the TechDocs tab fires comes back 500 MissingIndexError.
      publishDirectory: .data/techdocs

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group]
  locations:
    # golden paths, building blocks, blueprints and infrastructure
    - type: file
      target: ../../templates/golden-path/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/cicd-building-block/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/blueprint-webapp-platform/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/azure-aks-cluster/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/aws-eks-cluster/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/stackit-ske-cluster/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/openchoreo-namespace/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/openchoreo-deployment-blueprint/template.yaml
      rules:
        - allow: [Template]
    # showcase data for the Applications page
    - type: file
      target: ../../examples/showcase.yaml
      rules:
        - allow: [System, Component, Resource]
    # fake users/groups so ownership shows up somewhere instead of blank
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group, System]
  # infra doesn't get registered by hand. this scans the gitops repo for
  # entity files under catalog/ and picks up whatever is there 
  providers:
    github:
      # a team's requested infrastructure
      teamAlpha:
        organization: efekaya-devex-platform
        catalogPath: /catalog/*.yaml
        filters:
          repository: '^team-alpha$'
          branch: main
        schedule:
          frequency: { minutes: 1 }
          timeout: { minutes: 3 }
      # the services the golden path creates. without this they only exist in
      # whoever's laptop registered them
      services:
        organization: efekaya-devex-platform
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
        schedule:
          frequency: { minutes: 1 }
          timeout: { minutes: 3 }
      # components the OpenChoreo deployment blueprint writes to team-alpha
      ocApps:
        organization: efekaya-devex-platform
        catalogPath: /apps/*/catalog-info.yaml
        filters:
          repository: '^team-alpha$'
          branch: main
        schedule:
          frequency: { minutes: 1 }
          timeout: { minutes: 3 }
      # teams the OpenChoreo namespace template writes to idp-gitops (a different
      # org, same GITHUB_TOKEN integration)
      ocTenants:
        organization: efekaya-devops
        catalogPath: /tenants/*/catalog-info.yaml
        filters:
          repository: '^idp-gitops$'
          branch: main
        schedule:
          frequency: { minutes: 1 }
          timeout: { minutes: 3 }

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: kind-idp
          url: ${KUBERNETES_CLUSTER_URL}
          authProvider: serviceAccount
          serviceAccountToken: ${KUBERNETES_SA_TOKEN}
          skipTLSVerify: true
