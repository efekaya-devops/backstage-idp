# Fronts the Backstage backend. install.sh substitutes __DOMAIN__ and
# __ADMIN_CIDR__, then hands this to certbot, which rewrites it in place to add
# the TLS listener and the http -> https redirect.
server {
    listen 80;
    server_name __DOMAIN__;

    # Guest sign-in is on so visitors can browse without an account. A guest
    # token is also enough to drive the scaffolder, though - and the scaffolder
    # creates repositories, runs workflows and pushes images using the
    # platform's GitHub PAT. Hiding the page in the frontend doesn't close the
    # API.
    #
    # So reads are open to everyone (the catalog is the demo), and writes are
    # limited to ADMIN_CIDR - the operator running the golden path during a
    # walkthrough. Set ADMIN_CIDR to a home/office address, not 0.0.0.0/0: this
    # URL is linked publicly from a CV site.
    location /api/scaffolder/ {
        limit_except GET HEAD {
            allow __ADMIN_CIDR__;
            deny all;
        }
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # scaffolder tasks stream their log over a long-lived connection
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
