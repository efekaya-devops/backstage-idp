# Fronts the Backstage backend. install.sh substitutes __DOMAIN__ and hands
# this to certbot, which rewrites it in place to add the TLS listener and the
# http -> https redirect.
server {
    listen 80;
    server_name __DOMAIN__;

    # Guest sign-in is on so visitors can look around without an account. A
    # guest token is enough to drive the scaffolder, though - and the scaffolder
    # creates repositories and runs workflows with the platform's GitHub PAT.
    # Hiding the page in the frontend doesn't close the API, so reads are
    # allowed through and everything that writes stops here.
    location /api/scaffolder/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
