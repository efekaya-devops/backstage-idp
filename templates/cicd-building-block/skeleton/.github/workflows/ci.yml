# generated by the cicd-building-block portal template. the pipeline itself
# lives in the shared workflow; change inputs here, not the logic.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # the called workflow can only use the permissions granted here
    permissions:
      contents: write
      packages: write
      pull-requests: write
    # pin a tag or SHA once the repo has one
    uses: efekaya-devops/backstage-idp/.github/workflows/building-block-ci.yml@main
    with:
      runtime: ${{ values.runtime }}
      runtime-version: "${{ values.runtimeVersion }}"
      build-image: ${{ 'true' if values.buildImage else 'false' }}
{%- if values.buildImage %}
      platforms: "{% for p in values.platforms %}linux/${{ p }}{% if not loop.last %},{% endif %}{% endfor %}"
{%- endif %}
      trivy-severity: "${{ values.trivySeverity }}"
      sbom: ${{ 'true' if values.sbom else 'false' }}
{%- if values.buildImage and values.deploy == 'gitops' %}
      gitops-repo: "${{ values.gitopsRepo }}"
      gitops-values-path: "${{ values.gitopsValuesPath }}"
    secrets:
      GITOPS_TOKEN: ${{ '${{ secrets.GITOPS_TOKEN }}' }}
{%- endif %}
