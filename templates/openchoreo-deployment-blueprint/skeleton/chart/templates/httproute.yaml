{{- if and .Values.exposure.public (ne (include "app.isTask" .) "true") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.exposure.gateway.name }}
      namespace: {{ .Values.exposure.gateway.namespace }}
  hostnames:
    - {{ .Values.exposure.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.exposure.path }}
      backendRefs:
        - name: {{ include "app.name" . }}
          port: {{ .Values.port }}
{{- end }}
