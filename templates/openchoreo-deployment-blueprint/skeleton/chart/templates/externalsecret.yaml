{{- if .Values.secrets.items }}
# external-secrets.io/v1 is what the OpenChoreo install in this platform uses
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.secretName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secrets.storeName }}
  target:
    name: {{ include "app.secretName" . }}
  data:
    {{- range .Values.secrets.items }}
    - secretKey: {{ .envVar }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
