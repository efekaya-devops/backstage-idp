apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - dashboard.yaml
# CI bumps newTag to the built commit sha via a "deploy <sha>" PR
images:
  - name: app-image
    newName: ghcr.io/${{ (values.destination.owner ~ '/' ~ values.destination.repo) | lower }}
    newTag: latest
