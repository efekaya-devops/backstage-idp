apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-eks-cluster
  title: AWS EKS Cluster
  description: >-
    Request an Amazon EKS Kubernetes cluster as a call to the shared aws-eks
    Terraform module. The portal opens a pull request on the team repo; team-alpha CI
    runs terraform fmt and validate on infra/aws, a peer reviews it, and the
    merged file is the record of the request. Applying it is out of scope for
    the demo. The portal never holds AWS credentials.
  tags:
    - infrastructure
    - terraform
    - aws
    - kubernetes
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Cluster
      description: Identity and ownership of the cluster.
      required:
        - clusterName
        - team
        - environment
      properties:
        clusterName:
          title: Cluster name
          type: string
          description: Unique, lowercase and hyphenated. Becomes the Terraform module name.
          pattern: '^[a-z][a-z0-9-]{1,30}[a-z0-9]$'
          default: checkout-dev
          ui:autofocus: true
          ui:help: 2-32 characters, starts with a letter, no trailing hyphen.
        environment:
          title: Environment
          type: string
          default: dev
          enum: [dev, test, acc, prod]
          enumNames: [Development, Test, Acceptance, Production]
        team:
          title: Owning team
          type: string
          default: group:default/team-alpha
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
    - title: Capacity
      description: Kubernetes version and worker node sizing.
      properties:
        kubernetesVersion:
          title: Kubernetes version
          type: string
          default: "1.37"
          enum: ["1.34", "1.35", "1.36", "1.37"]
          ui:help: Versions in EKS standard support as of October 2026; older ones cost extra under extended support.
        nodeInstanceType:
          title: Node instance type
          type: string
          default: t3.medium
          enum: [t3.medium, t3.large, t3.xlarge, m5.large, m5.xlarge]
          enumNames:
            - t3.medium (2 vCPU, 4 GiB)
            - t3.large (2 vCPU, 8 GiB)
            - t3.xlarge (4 vCPU, 16 GiB)
            - m5.large (2 vCPU, 8 GiB, steady)
            - m5.xlarge (4 vCPU, 16 GiB, steady)
          ui:help: t3 is burstable and cheaper; m5 gives steady CPU for production.
        nodeCount:
          title: Number of nodes
          type: number
          default: 2
          minimum: 1
          maximum: 10

  steps:
    - id: fetch
      name: Render the Terraform
      action: fetch:template
      input:
        url: ./skeleton
        values:
          clusterName: ${{ parameters.clusterName }}
          kubernetesVersion: ${{ parameters.kubernetesVersion }}
          nodeInstanceType: ${{ parameters.nodeInstanceType }}
          nodeCount: ${{ parameters.nodeCount }}
          environment: ${{ parameters.environment }}
          team: ${{ parameters.team | parseEntityRef | pick('name') }}

    - id: pr
      name: Open a pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=efekaya-devex-platform&repo=team-alpha
        branchName: eks-${{ parameters.clusterName }}
        title: 'infra: eks cluster ${{ parameters.clusterName }}'
        description: |
          Requested via the portal by the ${{ parameters.team }} team.

          - kubernetes version: `${{ parameters.kubernetesVersion }}`
          - node instance: `${{ parameters.nodeInstanceType }}`
          - node count: `${{ parameters.nodeCount }}`
          - environment: `${{ parameters.environment }}`

          Uses the shared `aws-eks` module. CI validates the Terraform on this PR.

  output:
    links:
      - title: Review the pull request
        url: ${{ steps['pr'].output.remoteUrl }}
