apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: stackit-ske-cluster
  title: StackIT SKE Cluster (Sovereign EU)
  description: >-
    Request a managed Kubernetes cluster on STACKIT, the German sovereign cloud
    (region eu01). A call to the shared stackit-ske Terraform module, opened as
    a pull request with the module call for review; applying it is out of scope
    for the demo. Your
    data stays under EU jurisdiction and the portal never holds STACKIT
    credentials.
  tags:
    - infrastructure
    - terraform
    - stackit
    - sovereign
    - kubernetes
spec:
  owner: platform-team
  type: infrastructure

  parameters:
    - title: Cluster
      description: Identity, ownership and STACKIT project.
      required:
        - clusterName
        - projectId
        - team
        - environment
      properties:
        clusterName:
          title: Cluster name
          type: string
          description: Lowercase and hyphenated. SKE limits cluster names to 11 characters.
          pattern: '^[a-z][a-z0-9-]{0,9}[a-z0-9]$'
          maxLength: 11
          default: ske-dev
          ui:autofocus: true
          ui:help: 2-11 characters, starts with a letter, no trailing hyphen.
        projectId:
          title: STACKIT project ID
          type: string
          description: UUID of the STACKIT project the cluster lives in.
          default: 3f2a9c1e-8b4d-4e6a-9f10-2c7d5a1b8e44
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          ui:help: Find it in the STACKIT portal under the project's settings. The project must already exist.
        environment:
          title: Environment
          type: string
          default: dev
          enum: [dev, test, acc, prod]
          enumNames: [Development, Test, Acceptance, Production]
        team:
          title: Owning team
          type: string
          default: group:default/team-alpha
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
    - title: Capacity
      description: Kubernetes version and the default worker node pool (region eu01).
      properties:
        kubernetesVersion:
          title: Minimum Kubernetes version
          type: string
          default: "1.33"
          pattern: '^1\.[0-9]{2}$'
          ui:help: SKE patches within this minor version automatically. Check the versions SKE currently offers before choosing a newer one.
        machineType:
          title: Node machine type
          type: string
          default: g2i.2
          enum: [g2i.2, g2i.4, g2i.8]
          enumNames:
            - g2i.2 (2 vCPU, 8 GiB)
            - g2i.4 (4 vCPU, 16 GiB)
            - g2i.8 (8 vCPU, 32 GiB)
        minNodes:
          title: Minimum nodes
          type: number
          default: 1
          minimum: 1
          maximum: 20
        maxNodes:
          title: Maximum nodes
          type: number
          default: 3
          minimum: 1
          maximum: 20
          ui:help: The pool autoscales between minimum and maximum. Must be at least the minimum.
        availabilityZone:
          title: Availability zone
          type: string
          default: eu01-1
          enum: [eu01-1, eu01-2, eu01-3]
    - title: Access
      description: Who can reach the Kubernetes API.
      properties:
        aclCidrs:
          title: Allowed API CIDRs
          type: array
          default: [203.0.113.0/24]
          items:
            type: string
            pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
          ui:help: Leave empty for an open API (non-production only). Otherwise list office or VPN ranges, e.g. 203.0.113.0/24.

  steps:
    - id: fetch
      name: Render the Terraform
      action: fetch:template
      input:
        url: ./skeleton
        values:
          clusterName: ${{ parameters.clusterName }}
          projectId: ${{ parameters.projectId }}
          kubernetesVersion: ${{ parameters.kubernetesVersion }}
          machineType: ${{ parameters.machineType }}
          minNodes: ${{ parameters.minNodes }}
          maxNodes: ${{ parameters.maxNodes }}
          availabilityZone: ${{ parameters.availabilityZone }}
          aclCidrs: ${{ parameters.aclCidrs }}
          environment: ${{ parameters.environment }}
          team: ${{ parameters.team | parseEntityRef | pick('name') }}

    - id: pr
      name: Open a pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=efekaya-devex-platform&repo=team-alpha
        branchName: ske-${{ parameters.clusterName }}
        title: 'infra: stackit ske cluster ${{ parameters.clusterName }}'
        description: |
          Requested via the portal by the ${{ parameters.team }} team.

          - region: `eu01` (sovereign EU)
          - kubernetes: `>= ${{ parameters.kubernetesVersion }}`
          - nodes: `${{ parameters.machineType }}`, ${{ parameters.minNodes }} to ${{ parameters.maxNodes }} in `${{ parameters.availabilityZone }}`
          - environment: `${{ parameters.environment }}`

          Uses the shared `stackit-ske` module. Opened for review only; nothing validates or applies it in the demo.
          The `stackit` provider needs credentials in the pipeline that applies it
          (`STACKIT_SERVICE_ACCOUNT_KEY_PATH`); the portal holds none.

  output:
    links:
      - title: Review the pull request
        url: ${{ steps['pr'].output.remoteUrl }}
