# apps reference this store by name (platform-secrets) in their ExternalSecrets
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-secrets
spec:
  provider:
{%- if values.secretProvider == 'azure-keyvault' %}
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${{ values.vaultUrl }}
      serviceAccountRef:
        name: secrets-reader
{%- elif values.secretProvider == 'aws-secrets-manager' %}
    aws:
      service: SecretsManager
      region: ${{ values.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: secrets-reader
{%- elif values.secretProvider == 'stackit-secrets-manager' %}
    vault:
      server: https://prod.sm.eu01.stackit.cloud
      path: ${{ values.stackitInstanceId }}
      version: v2
      auth:
        userPass:
          path: userpass
          username: ${{ values.stackitUsername }}
          secretRef:
            name: stackit-secrets-manager-credentials
            key: password
{%- else %}
    vault:
      server: ${{ values.vaultServer }}
      path: ${{ values.vaultMountPath }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ${{ values.vaultRole }}
          serviceAccountRef:
            name: secrets-reader
{%- endif %}
