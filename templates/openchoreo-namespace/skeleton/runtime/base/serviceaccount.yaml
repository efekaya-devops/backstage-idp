# identity ESO uses to read the secret backend; the cloud side trusts this account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
{%- if values.secretProvider == 'azure-keyvault' %}
  annotations:
    azure.workload.identity/client-id: ${{ values.identityClientId }}
{%- elif values.secretProvider == 'aws-secrets-manager' %}
  annotations:
    eks.amazonaws.com/role-arn: ${{ values.roleArn }}
{%- endif %}
