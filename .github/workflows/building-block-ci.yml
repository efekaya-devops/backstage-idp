# Reusable CI building block. Callers are generated by the cicd-building-block
# portal template:
#   uses: efekaya-devops/backstage-idp/.github/workflows/building-block-ci.yml@main
name: building-block-ci

on:
  workflow_call:
    inputs:
      runtime:
        description: node | python | go | java | dotnet. Node is npm-only (package-lock.json optional; yarn and pnpm are not supported)
        type: string
        required: true
      runtime-version:
        description: Toolchain version, e.g. 20, 3.12, 1.22, 21, 8.0
        type: string
        required: true
      build-image:
        description: Build a container image from ./Dockerfile
        type: boolean
        default: false
      platforms:
        description: Comma-separated buildx platforms
        type: string
        default: linux/amd64
      trivy-severity:
        description: Severities that fail the Trivy scan
        type: string
        default: CRITICAL
      sbom:
        description: Generate an SBOM and upload it as an artifact
        type: boolean
        default: true
      gitops-repo:
        description: owner/repo holding the deployment values; empty disables the bump
        type: string
        default: ""
      gitops-values-path:
        description: Values file in the GitOps repo, e.g. apps/web/values.yaml
        type: string
        default: ""
      gitops-image-tag-key:
        description: yq path of the image tag in the values file
        type: string
        default: .image.tag
    secrets:
      GITOPS_TOKEN:
        description: Token with contents and pull-requests write on the GitOps repo. Not needed when gitops-repo is the calling repo (github.token is used)
        required: false

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: inputs.runtime == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.runtime-version }}
          # npm cache needs a lockfile; yarn/pnpm repos are built with npm (npm-only)
          cache: ${{ hashFiles('**/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: "**/package-lock.json"
      - if: inputs.runtime == 'node'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build --if-present
          npm test --if-present

      - if: inputs.runtime == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.runtime-version }}
      - if: inputs.runtime == 'python'
        run: |
          python -m pip install --upgrade pip pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # exit code 5 means no tests were collected, which is not a failure
          python -m pytest || [ $? -eq 5 ]

      - if: inputs.runtime == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ inputs.runtime-version }}
      - if: inputs.runtime == 'go'
        run: |
          go build ./...
          go test ./...

      - if: inputs.runtime == 'java'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ inputs.runtime-version }}
          cache: ${{ hashFiles('**/pom.xml') != '' && 'maven' || 'gradle' }}
      - if: inputs.runtime == 'java'
        run: |
          if [ -f pom.xml ]; then mvn -B -ntp verify
          elif [ -f gradlew ]; then chmod +x gradlew && ./gradlew build
          else echo "no pom.xml or gradlew found" && exit 1; fi

      - if: inputs.runtime == 'dotnet'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ inputs.runtime-version }}
      - if: inputs.runtime == 'dotnet'
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: true
          exit-code: "1"

  sbom:
    if: inputs.sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json

  image:
    if: inputs.build-image
    needs: [build-test, trivy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # amd64 alone fails with "exec format error" on Apple Silicon or Graviton
      # nodes; QEMU makes the arm64 half slower to build but portable to run.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitops-bump:
    if: >-
      inputs.build-image && inputs.gitops-repo != '' &&
      github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: image
    runs-on: ubuntu-latest
    # only used when gitops-repo is this repo (github.token); a separate repo uses GITOPS_TOKEN
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.gitops-repo }}
          # no GITOPS_TOKEN needed when the manifests live in the same repo
          token: ${{ secrets.GITOPS_TOKEN || (inputs.gitops-repo == github.repository && github.token) || '' }}
      - name: Set the image tag
        env:
          KEY: ${{ inputs.gitops-image-tag-key }}
          FILE: ${{ inputs.gitops-values-path }}
          TAG: ${{ github.sha }}
        run: yq -i "$KEY = strenv(TAG)" "$FILE"
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITOPS_TOKEN || (inputs.gitops-repo == github.repository && github.token) || '' }}
          branch: bump/${{ github.event.repository.name }}
          commit-message: "deploy: ${{ github.event.repository.name }} ${{ github.sha }}"
          title: "deploy: ${{ github.event.repository.name }} ${{ github.sha }}"
          body: Image tag bump from ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
