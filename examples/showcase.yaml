# Showcase data for the Applications page. The page reads only the catalog:
#   label      openchoreo.io/managed: "true"      on every entity
#   Namespace  kind Resource, spec.type openchoreo-namespace, named ns-<name>
#              /namespace             the namespace name
#              /guardrails (optional) JSON: environments [{name,dataPlane}],
#                quota {env:{cpu,memory,pods}}, network [text], secretStore
#                {provider,name}, podSecurity, rbac {owners,readers[]}
#   Project    kind System; components point at it with spec.system
#              /namespace, /pipeline (optional, free text "a -> b -> c")
#   Component  annotations openchoreo.io/project, /namespace,
#              /component-type (service|web-application|scheduled-task),
#              /deployments "env=version:Status,..." with Status one of
#              Ready|Progressing|Failed|NotDeployed (a missing env = not deployed)
#              /environment-details (optional) JSON keyed by env, each:
#                version, status, image, replicas "ready/desired", endpoint
#                (URL or null), deployedAt (ISO), deployedBy, reason (for
#                Failed/Progressing), release. Overrides /deployments per env.
#              Missing fields render as a dash.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ns-team-checkout
  title: team-checkout
  description: OpenChoreo namespace for the checkout team.
  labels:
    openchoreo.io/managed: 'true'
  annotations:
    openchoreo.io/namespace: team-checkout
    openchoreo.io/guardrails: |-
      {
        "environments": [
          {
            "name": "development",
            "dataPlane": "dp-nonprod-westeurope"
          },
          {
            "name": "staging",
            "dataPlane": "dp-nonprod-westeurope"
          },
          {
            "name": "production",
            "dataPlane": "dp-prod-westeurope"
          }
        ],
        "quota": {
          "development": {
            "cpu": "4",
            "memory": "8Gi",
            "pods": "30"
          },
          "staging": {
            "cpu": "8",
            "memory": "16Gi",
            "pods": "50"
          },
          "production": {
            "cpu": "24",
            "memory": "48Gi",
            "pods": "120"
          }
        },
        "network": [
          "Default deny for all ingress and egress",
          "Egress to cluster DNS allowed",
          "Traffic within the namespace allowed",
          "Gateway ingress on declared service ports only"
        ],
        "secretStore": {
          "provider": "Azure Key Vault",
          "name": "kv-team-checkout"
        },
        "podSecurity": "restricted",
        "rbac": {
          "owners": "group:team-alpha",
          "readers": [
            "group:developers",
            "group:platform-team"
          ]
        }
      }
spec:
  type: openchoreo-namespace
  owner: group:team-alpha
